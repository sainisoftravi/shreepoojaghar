apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads-pvc
  namespace: shree-pooja
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-whatsapp-pvc
  namespace: shree-pooja
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: shree-pooja
  labels:
    app: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres-and-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z -w 2 postgres-service.shree-pooja.svc.cluster.local 5432; do
                sleep 2
              done
              echo "PostgreSQL is ready!"

              echo "Waiting for Redis..."
              until nc -z -w 2 redis-service.shree-pooja.svc.cluster.local 6379; do
                sleep 2
              done
              echo "Redis is ready!"
      containers:
        - name: backend
          image: shreepoojaghar-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: PORT
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service.shree-pooja.svc.cluster.local:5432/$(POSTGRES_DB)?schema=public"
            - name: DIRECT_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres-service.shree-pooja.svc.cluster.local:5432/$(POSTGRES_DB)?schema=public"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: JWT_EXPIRES_IN
            - name: PII_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: PII_ENCRYPTION_KEY
            - name: WHATSAPP_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: WHATSAPP_PROVIDER
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: CORS_ORIGIN
            - name: STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: STORE_NAME
            - name: STORE_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: STORE_ADDRESS
            - name: STORE_PHONE
              valueFrom:
                configMapKeyRef:
                  name: shree-pooja-config
                  key: STORE_PHONE
            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: WHATSAPP_ACCESS_TOKEN
                  optional: true
            - name: WHATSAPP_PHONE_NUMBER_ID
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: WHATSAPP_PHONE_NUMBER_ID
                  optional: true
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: CLOUDINARY_CLOUD_NAME
                  optional: true
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: CLOUDINARY_API_KEY
                  optional: true
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: CLOUDINARY_API_SECRET
                  optional: true
            - name: CLOUDINARY_URL
              valueFrom:
                secretKeyRef:
                  name: shree-pooja-secrets
                  key: CLOUDINARY_URL
                  optional: true
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/uploads
            - name: whatsapp-volume
              mountPath: /app/.wwebjs_auth
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: backend-uploads-pvc
        - name: whatsapp-volume
          persistentVolumeClaim:
            claimName: backend-whatsapp-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: shree-pooja
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
      name: http
