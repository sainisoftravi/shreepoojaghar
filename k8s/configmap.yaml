apiVersion: v1
kind: ConfigMap
metadata:
  name: shree-pooja-config
  namespace: shree-pooja
data:
  NODE_ENV: "production"
  PORT: "3001"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "shreepooja"
  REDIS_URL: "redis://redis-service.shree-pooja.svc.cluster.local:6379"
  JWT_EXPIRES_IN: "30d"
  WHATSAPP_PROVIDER: "opensource"
  CORS_ORIGIN: "*"
  STORE_NAME: "Shree Pooja Ghar"
  STORE_ADDRESS: "Ajmer, Rajasthan, India"
  STORE_PHONE: ""
  # Frontend internal backend routing
  BACKEND_URL: "http://backend-service.shree-pooja.svc.cluster.local:3001"
