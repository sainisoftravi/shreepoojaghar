apiVersion: v1
kind: Secret
metadata:
  name: shree-pooja-secrets
  namespace: shree-pooja
type: Opaque
stringData:
  # CHANGE THESE VALUES BEFORE DEPLOYMENT
  POSTGRES_PASSWORD: "change_this_postgres_secure_password"
  JWT_SECRET: "change_this_jwt_secret_generate_random_key_64_chars"
  # Generate with: openssl rand -hex 32
  PII_ENCRYPTION_KEY: "change_this_pii_encryption_key_32_bytes_hex"
  
  # Optional: WhatsApp Cloud API (if WHATSAPP_PROVIDER=meta)
  WHATSAPP_ACCESS_TOKEN: ""
  WHATSAPP_PHONE_NUMBER_ID: ""
  
  # Optional: Cloudinary credentials (for permanent cloud image storage)
  CLOUDINARY_CLOUD_NAME: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  CLOUDINARY_URL: ""
